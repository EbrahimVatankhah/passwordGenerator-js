<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="tailwindcss.js"></script>

</head>
<body class="text-slate-300 min-h-screen flex flex-col items-center justify-center p-4">

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-6 py-3 rounded-full bg-slate-800 border border-slate-700 shadow-2xl transition-all duration-300 opacity-0 -translate-y-12">
        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span class="text-sm font-semibold text-white">Password copied!</span>
    </div>

    <div class="w-full max-w-lg glass-panel rounded-2xl p-1 animate-slide-up">
        
        <div class="p-6 md:p-8 space-y-6">
            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-white text-lg font-bold">Generate Password</h1>
                    <p class="text-slate-500 text-xs mt-1">Press Spacebar to refresh</p>
                </div>
                <div class="text-right">
                    <span id="strengthLabel" class="text-xs font-bold uppercase tracking-wider text-slate-500">Strength</span>
                    <div class="flex gap-1 mt-1">
                        <div class="s-bar w-3 h-1 rounded-full bg-slate-700 transition-colors duration-300"></div>
                        <div class="s-bar w-3 h-1 rounded-full bg-slate-700 transition-colors duration-300"></div>
                        <div class="s-bar w-3 h-1 rounded-full bg-slate-700 transition-colors duration-300"></div>
                        <div class="s-bar w-3 h-1 rounded-full bg-slate-700 transition-colors duration-300"></div>
                    </div>
                </div>
            </div>

            <div class="relative group">
                <div class="bg-slate-900/50 border border-slate-700 rounded-xl p-5 flex items-center justify-between transition-colors hover:border-accent">
                    <input type="text" id="passwordOutput" readonly 
                        class="bg-transparent w-full text-2xl md:text-3xl font-mono text-white outline-none tracking-tight placeholder-slate-600"
                        value="Generating...">
                    
                    <div class="flex items-center gap-2 pl-4">
                        <button id="refreshBtn" class="p-2 text-slate-400 hover:text-white hover:bg-slate-700/50 rounded-lg transition-all" title="Regenerate">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                        <button id="copyBtn" class="p-2 bg-accent text-white rounded-lg shadow-lg hover:bg-accent-hover active:scale-95 transition-all" title="Copy">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-slate-900/30 border-t border-slate-700/50 p-6 md:p-8 rounded-b-2xl space-y-6">
            
            <div class="space-y-3">
                <div class="flex justify-between items-center text-sm font-medium">
                    <span class="text-white">Password Length</span>
                    <span id="lengthVal" class="text-accent font-mono text-xl">16</span>
                </div>
                <input type="range" id="lengthRange" min="6" max="32" value="16" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <label class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg border border-transparent hover:border-slate-600 cursor-pointer transition-all">
                    <span class="text-sm">Uppercase (A-Z)</span>
                    <div class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="chkUpper" checked class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-accent"></div>
                    </div>
                </label>

                <label class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg border border-transparent hover:border-slate-600 cursor-pointer transition-all">
                    <span class="text-sm">Lowercase (a-z)</span>
                    <div class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="chkLower" checked class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-accent"></div>
                    </div>
                </label>

                <label class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg border border-transparent hover:border-slate-600 cursor-pointer transition-all">
                    <span class="text-sm">Numbers (0-9)</span>
                    <div class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="chkNumber" checked class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-accent"></div>
                    </div>
                </label>

                <label class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg border border-transparent hover:border-slate-600 cursor-pointer transition-all">
                    <span class="text-sm">Symbols (!@#)</span>
                    <div class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="chkSymbol" checked class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-accent"></div>
                    </div>
                </label>

                <label class="md:col-span-2 flex items-center justify-between p-3 bg-slate-800/50 rounded-lg border border-transparent hover:border-slate-600 cursor-pointer transition-all">
                    <div class="flex flex-col">
                        <span class="text-sm text-white">Exclude Ambiguous</span>
                        <span class="text-xs text-slate-500">Removes i, l, 1, L, o, 0, O</span>
                    </div>
                    <div class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="chkAmbiguous" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-accent"></div>
                    </div>
                </label>

            </div>
            
            <div class="pt-4 border-t border-slate-700/50">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold uppercase text-slate-500">History</span>
                    <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-white transition-colors">Clear</button>
                </div>
                <div id="historyList" class="space-y-2 max-h-24 overflow-y-auto">
                    </div>
            </div>

        </div>
    </div>

   <script src="app.js"></script>
</body>
</html>
